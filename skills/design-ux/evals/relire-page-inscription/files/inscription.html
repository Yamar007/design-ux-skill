<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscription</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #fff; }
  .hero { background: linear-gradient(135deg, #7b2ff7, #f107a3); color: #fff; padding: 40px 20px; text-align: center; }
  .hero h1 { margin: 0; font-size: 28px; }
  form { max-width: 360px; margin: 24px auto; padding: 0 16px; }
  input { display: block; width: 100%; padding: 6px; margin: 6px 0; border: 1px solid #eee; font-size: 13px; }
  .btn { background: linear-gradient(90deg, #8e2de2, #4a00e0); color: #fff; border: 0; padding: 6px; width: 100%; font-size: 13px; border-radius: 20px; }
  .err { color: red; font-size: 12px; }
  .small { font-size: 11px; color: #aaa; }
  .link { color: #8e2de2; cursor: pointer; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
  <div class="hero">
    <img src="logo.png">
    <h1>Rejoins la communauté ! 🚀✨</h1>
    <p>La plateforme qui révolutionne ta façon de faire du sport 💪</p>
  </div>

  <form id="f" onsubmit="return envoyer()">
    <input type="text" id="nom" placeholder="Nom complet">
    <input type="text" id="email" placeholder="Email">
    <input type="text" id="tel" placeholder="Téléphone *">
    <input type="password" id="mdp" placeholder="Mot de passe" onpaste="return false">
    <input type="password" id="mdp2" placeholder="Confirmer" onpaste="return false">
    <p class="small"><input type="checkbox" checked style="display:inline;width:auto"> Je veux recevoir les offres de nos partenaires</p>
    <p class="small">En continuant tu acceptes les CGU.</p>
    <p class="err" id="err"></p>
    <button class="btn" type="submit">Envoyer</button>
    <div class="link" onclick="location.href='/login'">Déjà inscrit ? Connexion</div>
  </form>

<script>
  function envoyer() {
    var mdp = document.getElementById('mdp').value
    if (mdp.length < 12 || !/[A-Z]/.test(mdp) || !/[0-9]/.test(mdp) || !/[^A-Za-z0-9]/.test(mdp)) {
      document.getElementById('err').innerText = 'Erreur'
      document.getElementById('f').reset()
      return false
    }
    return true
  }
</script>
</body>
</html>
